apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: godev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      imagePullSecrets: 
      - name: harbor-local174
      containers:
      - name: logsvc
        image: 192.168.5.174:80/godev/alert-receiver:v2
        ports:
        - containerPort: 8080
        resources: 
          requests: 
            cpu: 64m
            memory: 32Mi
          limits: 
            cpu: 512m
            memory: 1024Mi
        env: 
        - name: GOMEMLIMIT
          valueFrom: 
            resourceFieldRef: 
              resource: limits.memory
              divisor: 1
        livenessProbe: 
          httpGet: 
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 2
          failureThreshold: 3 # Worsest case restart after 30s
        readinessProbe:
          httpGet: 
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2 # Worsest case take off from traffic: 2*5s = 10s
          failureThreshold: 2
        lifecycle: 
          preStop: 
            sleep: 
              seconds: 3
          
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: godev
spec:
  type: NodePort
  selector:
    app: alert-receiver
  ports:
  - port: 8080
    targetPort: 8080