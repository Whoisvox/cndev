apiVersion: v1
kind: ConfigMap
metadata: 
  name: logsvc-config
  namespace: godev
data: 
  LISTEN_ADDR: ":8080"
  READ_HEADER_TIMEOUT: "5s"
  READ_TIMEOUT: "10s"
  WRITE_TIMEOUT: "10s"
  IDLE_TIMEOUT: "60s"
  DRAIN_TIMEOUT: "3s"
  LOG_LEVEL: "warn"
  HANDLER_TIMEOUT: "2s"
  FAIL_RATE: "0"

---
apiVersion: v1
kind: Secret
metadata: 
  name: logsvc-secret
  namespace: godev
type: Opaque
stringData:
  DB_PASSWORD: "111"
  API_TOKEN: "token"
  
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logsvc
  namespace: godev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logsvc
  template:
    metadata:
      annotations: 
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        prometheus.io/scrape_interval: "15s"
      labels:
        app: logsvc
    spec:
      imagePullSecrets: 
      - name: harbor-local174
      containers:
      - name: logsvc
        image: 192.168.5.174:80/godev/logsvc:v12
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources: 
          requests: 
            cpu: 500m
            memory: 8Mi
          limits: 
            cpu: 2000m
            memory: 512Mi
        env: 
        - name: GOMEMLIMIT
          valueFrom: 
            resourceFieldRef: 
              resource: limits.memory
              divisor: 1
        envFrom: 
        - configMapRef: 
            name: logsvc-config
        - secretRef: 
            name: logsvc-secret
        livenessProbe: 
          httpGet: 
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 2
          failureThreshold: 3 # Worsest case restart after 30s
        readinessProbe:
          httpGet: 
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2 # Worsest case take off from traffic: 2*5s = 10s
          failureThreshold: 2
        lifecycle: 
          preStop: 
            sleep: 
              seconds: 3
          
---
apiVersion: v1
kind: Service
metadata:
  name: logsvc
  namespace: godev
spec:
  type: NodePort
  selector:
    app: logsvc
  ports:
  - port: 8080
    targetPort: 8080